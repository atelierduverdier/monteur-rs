[package]
name = "appli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Le Monteur 2 : la fenêtre"

[[bin]]
name = "monteur2"
path = "src/main.rs"

[dependencies]
charte = { path = "../charte" }
noyau = { path = "../noyau" }
composeur = { path = "../composeur" }
media = { path = "../media" }
rendu = { path = "../rendu" }
dear-app.workspace = true
dear-imgui-rs.workspace = true
wgpu.workspace = true
tiny-skia = "0.11"
serde_json = "1"
rfd = "0.18"
trash = "5"
opener = "0.9"
jpeg-encoder = "0.7"

# Linux seulement : le nanoKONTROL2 par le séquenceur d'ALSA, le raccourci global par le portail.
[target.'cfg(target_os = "linux")'.dependencies]
alsa = "0.11"
ashpd = { version = "0.13.13", default-features = false, features = ["tokio", "global_shortcuts"] }
tokio = { version = "1.54.1", features = ["rt", "time"] }
futures-util = "0.3.34"

# Windows seulement : filmer une fenêtre (Windows.Graphics.Capture), sa zone cliente, le raccourci global.
[target.'cfg(windows)'.dependencies]
windows-capture = "2.0.1"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }

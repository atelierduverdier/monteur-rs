[package]
name = "appli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Le Monteur 2 : la fenêtre"

[[bin]]
name = "monteur2"
path = "src/main.rs"

[dependencies]
charte = { path = "../charte" }
noyau = { path = "../noyau" }
composeur = { path = "../composeur" }
media = { path = "../media" }
rendu = { path = "../rendu" }
dear-app.workspace = true
dear-imgui-rs.workspace = true
wgpu.workspace = true
tiny-skia = "0.11"
serde_json = "1"
ashpd = { version = "0.13.13", default-features = false, features = ["tokio", "global_shortcuts"] }
tokio = { version = "1.54.1", features = ["rt", "time"] }
futures-util = "0.3.34"
